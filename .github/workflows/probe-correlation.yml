name: Sonda copertura dati correlazione (Stooq)

on:
  workflow_dispatch: {}

jobs:
  probe:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'

      - name: Esegui la sonda
        run: python3 scripts/fetch_correlation_probe.py
