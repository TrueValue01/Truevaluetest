name: Sonda NPL/Allowance (SEC XBRL)

on:
  workflow_dispatch: {}

permissions:
  contents: write

jobs:
  probe:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'

      - name: Installa dipendenze
        run: pip install requests

      - name: Esegui la sonda
        run: python3 scripts/fetch_npl_probe.py

      - name: Commit del log (solo se cambiato)
        run: |
          git config user.name "npl-probe-bot"
          git config user.email "actions@github.com"
          git add npl-probe-log.json
          git diff --staged --quiet || git commit -m "Sonda NPL: aggiornato npl-probe-log.json"
          git push
