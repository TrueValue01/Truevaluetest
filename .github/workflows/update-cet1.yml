name: Sonda CET1 (bankregreports)

on:
  workflow_dispatch: {}
  schedule:
    - cron: '0 8 15 1,4,7,10 *'

permissions:
  contents: write

jobs:
  probe:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'

      - name: Installa dipendenze
        run: pip install requests

      - name: Esegui la sonda
        env:
          BRR_API_KEY: ${{ secrets.BRR_API_KEY }}
        run: python3 scripts/fetch_cet1_probe.py

      - name: Commit del log (solo se cambiato)
        run: |
          git config user.name "cet1-probe-bot"
          git config user.email "actions@github.com"
          git add cet1-probe-log.json
          git diff --staged --quiet || git commit -m "Sonda CET1: aggiornato cet1-probe-log.json"
          git push
