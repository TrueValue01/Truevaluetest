<!DOCTYPE html>
<html lang="it">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Test conferma blocco ssga.com</title>
<style>
  body { font-family: -apple-system, sans-serif; padding: 16px; max-width: 600px; margin: 0 auto; }
  button { display: block; width: 100%; padding: 14px; margin: 10px 0; font-size: 16px; border-radius: 8px; border: none; background: #2563eb; color: white; }
  button:disabled { background: #93c5fd; }
  .status { padding: 12px; border-radius: 8px; margin: 10px 0; font-size: 14px; white-space: pre-wrap; word-break: break-word; }
  .ok { background: #dcfce7; color: #166534; }
  .err { background: #fee2e2; color: #991b1b; }
  .wait { background: #fef9c3; color: #854d0e; }
  h2 { font-size: 16px; margin-top: 24px; }
</style>
</head>
<body>

<h1>Test conferma: ssga.com è bloccato a livello di dominio?</h1>

<h2>Test A — pagina semplice ssga.com</h2>
<button id="btnA" onclick="testA()">Prova pagina semplice</button>
<div id="statusA" class="status wait">Non ancora testato</div>

<h2>Test B — file xlsx holdings (quello che ci serve)</h2>
<button id="btnB" onclick="testB()">Prova file xlsx SPY</button>
<div id="statusB" class="status wait">Non ancora testato</div>

<h2>Test C — Borsa Italiana (controllo: deve funzionare)</h2>
<button id="btnC" onclick="testC()">Prova Borsa Italiana (controllo)</button>
<div id="statusC" class="status wait">Non ancora testato</div>

<script>
const WORKER = 'https://truevalue-proxy.donofriopacheco.workers.dev';
const TIMEOUT_MS = 15000;

async function runTest(btnId, statusId, targetUrl) {
  const btn = document.getElementById(btnId);
  const status = document.getElementById(statusId);
  btn.disabled = true;
  status.className = 'status wait';
  status.textContent = 'In corso... (timeout automatico a 15 secondi)';

  const controller = new AbortController();
  const timer = setTimeout(() => controller.abort(), TIMEOUT_MS);
  const start = Date.now();

  try {
    const proxied = WORKER + '?url=' + encodeURIComponent(targetUrl);
    const resp = await fetch(proxied, { signal: controller.signal });
    const elapsed = Date.now() - start;
    const text = await resp.text();
    status.className = 'status ok';
    status.textContent = `ARRIVATO in ${elapsed}ms — status HTTP ${resp.status}\n\nPrime 300 caratteri:\n${text.slice(0, 300)}`;
  } catch (e) {
    const elapsed = Date.now() - start;
    if (e.name === 'AbortError') {
      status.className = 'status err';
      status.textContent = `BLOCCATO — nessuna risposta dopo ${elapsed}ms (timeout). Questo conferma il blocco.`;
    } else {
      status.className = 'status err';
      status.textContent = `ERRORE dopo ${elapsed}ms: ${e.message}`;
    }
  } finally {
    clearTimeout(timer);
    btn.disabled = false;
  }
}

function testA() {
  runTest('btnA', 'statusA', 'https://www.ssga.com/us/en/individual');
}
function testB() {
  runTest('btnB', 'statusB', 'https://www.ssga.com/us/en/individual/etfs/library-content/products/fund-data/etfs/us/holdings-daily-us-en-spy.xlsx');
}
function testC() {
  runTest('btnC', 'statusC', 'https://www.borsaitaliana.it/borsa/obbligazioni/mot/btp/scheda/IT0003934657.html');
}
</script>

</body>
</html>
