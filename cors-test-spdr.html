<!DOCTYPE html>
<html lang="it">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Test CORS — SPDR Holdings</title>
<style>
  body { font-family: -apple-system, sans-serif; padding: 16px; background: #0f172a; color: #e2e8f0; }
  button { background: #f97316; color: white; border: none; padding: 14px 20px; border-radius: 8px; font-size: 16px; width: 100%; margin: 8px 0; }
  pre { background: #1e293b; padding: 12px; border-radius: 8px; overflow-x: auto; white-space: pre-wrap; word-break: break-word; font-size: 13px; }
  .ok { color: #4ade80; font-weight: bold; }
  .fail { color: #f87171; font-weight: bold; }
</style>
</head>
<body>

<h2>Test CORS — SPDR Holdings (ssga.com) e CAPE (multpl.com)</h2>
<p>Due test in uno. Deve girare da GitHub Pages (https), non da file locale.</p>

<button onclick="testUrl('spdr')">Test 1: holdings SPY (SPDR)</button>
<button onclick="testUrl('cape')">Test 2: CAPE S&P 500 (multpl.com)</button>

<pre id="output">Premi un bottone per iniziare.</pre>

<script>
const urls = {
  spdr: "https://www.ssga.com/us/en/individual/etfs/library-content/products/fund-data/etfs/us/holdings-daily-us-en-spy.xlsx",
  cape: "https://www.multpl.com/shiller-pe"
};

async function testUrl(tipo) {
  const url = urls[tipo];
  const out = document.getElementById("output");
  out.textContent = "Chiamata in corso verso:\n" + url + "\n\n...";

  try {
    const resp = await fetch(url);
    const contentType = resp.headers.get("Content-Type") || "(nessuno)";

    if (tipo === "spdr") {
      const buf = await resp.arrayBuffer();
      out.innerHTML =
        '<span class="ok">✅ CORS APERTO — la chiamata diretta funziona</span>\n\n' +
        "HTTP status: " + resp.status + "\n" +
        "Content-Type: " + contentType + "\n" +
        "Dimensione risposta: " + buf.byteLength + " byte\n\n" +
        (buf.byteLength > 1000
          ? "Sembra un file vero (dimensione plausibile per un Excel)."
          : "Dimensione sospetta — potrebbe essere una pagina di errore invece del file.");
    } else {
      const text = await resp.text();
      out.innerHTML =
        '<span class="ok">✅ CORS APERTO — la chiamata diretta funziona</span>\n\n' +
        "HTTP status: " + resp.status + "\n" +
        "Lunghezza risposta: " + text.length + " caratteri\n\n" +
        "Contiene 'Shiller'? " + (text.includes("Shiller") ? "SI'" : "NO") + "\n\n" +
        "Primi 500 caratteri:\n" + text.substring(0, 500);
    }
  } catch (err) {
    out.innerHTML =
      '<span class="fail">❌ BLOCCATO — probabile CORS</span>\n\n' +
      "Errore: " + err.message + "\n\n" +
      "Se blocca, serve lo stesso Worker già usato per Borsa Italiana " +
      "(basta aggiungere il dominio alla allowlist).";
  }
}
</script>

</body>
</html>
